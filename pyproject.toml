[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = ""
version = "0.1.0"
description = "Small, testable multi-agent orchestration for LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Afnan Ahmed Adil" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
llm = ["anthropic>=0.30"]

[tool.setuptools]
packages = ["orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
